project = "sluggrs"
bench_scripts = "bench"
bench_lib = "bench/lib"

# These carry emoji deliberately - they are emoji-rendering fixtures (the whole
# point is exercising the emoji glyph path), so the gremlin scan must skip them.
# snapshot.rs also carries runic fixture text.
[gremlins]
exclude = [
    "docs/emoji-fallback-spec.md",
    "examples/email_bench.rs",
    "examples/emoji_test",
    "examples/snapshot.rs",
]

[sluggrs]
width = 1920
height = 1080
pixel_diff_threshold = 0.1

[[sluggrs.snapshot]]
id = "latin-sizes"
description = "Latin size sweep 8-72px: MSAA blend region, midrange, darkening cutoff, large sizes"
fonts = [
    "examples/fonts/InterVariable.ttf",
    "examples/fonts/Roboto-Regular.ttf",
    "examples/fonts/Roboto-Bold.ttf",
]

[[sluggrs.snapshot]]
id = "thin-stems"
description = "Roboto Thin at small sizes and several brightness levels (stem darkening gamma)"
fonts = [
    "examples/fonts/Roboto-Thin.ttf",
    "examples/fonts/Roboto-Regular.ttf",
]

[[sluggrs.snapshot]]
id = "emoji-colr"
description = "COLRv0 (Twemoji) and COLRv1 (Noto) color emoji at 16/32/64px"
fonts = [
    "examples/fonts/InterVariable.ttf",
    "examples/fonts/TwemojiCOLRv0.ttf",
    "examples/fonts/NotoColorEmoji-Regular.ttf",
]

[[sluggrs.snapshot]]
id = "rune-mono"
description = "Runic outlines and ligature-heavy monospace (CaskaydiaCove)"
fonts = [
    "examples/fonts/EBH Runes.otf",
    "examples/fonts/CaskaydiaCoveNerdFont-Regular.ttf",
]

[[sluggrs.snapshot]]
id = "decorations"
description = "Outlines, hard and spread shadows, stacked paint order, and shared glyphs decorated at two sizes"
fonts = [
    "examples/fonts/InterVariable.ttf",
]

[[sluggrs.snapshot]]
id = "ring"
description = "Ring mode: hollow text, ring with opaque and translucent fills, ring over a shadow, and a Solid slab for contrast"
fonts = [
    "examples/fonts/InterVariable.ttf",
]

[[sluggrs.snapshot]]
id = "blur"
description = "Blurred shadows: sigma sweep, large sigma on small type, centred glow, kerning and counters, and a blurred shadow behind a hard one"
fonts = [
    "examples/fonts/InterVariable.ttf",
]

[test]
debug = true

# Script benches (brokkr man bench). Every example bench shares one script:
# the example does its own timing and prints key=value lines on stderr, which
# the script stores in record.kv.

[bench.render]
script_file = "bench/example.lua"
description = "Cold, warm and mixed prepare of a Latin paragraph plus GPU render, 1920x1080 offscreen"
target = "hotpath"
profile = "release"
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]

[bench.email]
script_file = "bench/example.lua"
description = "Email-client-scale prepare, 8k+ glyphs, with scroll"
target = "email_bench"
profile = "release"
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]

[bench.email2]
script_file = "bench/example.lua"
description = "Mixed-locale inbox, CJK, Arabic and Hindi, 200 messages"
target = "email2_bench"
profile = "release"
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]

[bench.shared-buffer]
script_file = "bench/example.lua"
description = "Shared buffer prepare: direct hits, reculls and misses"
target = "shared_buffer_bench"
profile = "release"
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]

[bench.atlas-repopulate]
script_file = "bench/example.lua"
description = "Atlas repopulate from the blob cache after eviction"
target = "atlas_repopulate_bench"
profile = "release"
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]

[bench.gpu]
script_file = "bench/example.lua"
description = "GPU fragment shader timing, no hotpath instrumentation"
target = "gpu-bench"
profile = "release"
